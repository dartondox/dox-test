name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dox_ref:
        description: dartondox/dox branch to test against
        default: develop

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, sqlite]
    env:
      DB_CONNECTION: ${{ matrix.db }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dox_test
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dox_test
        ports: ["3326:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 2s --health-retries 60
      redis:
        image: redis:8-alpine
        ports: ["6459:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
    steps:
      # MinIO needs a start command, so it can not be a service.
      # The folder made by mkdir is the dox-test bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9110:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            --entrypoint bash cgr.dev/chainguard/minio:latest \
            -c "mkdir -p /data/dox-test && exec minio server /data"
          for i in $(seq 1 30); do docker exec minio mc ready local && break; sleep 2; done
      - uses: actions/checkout@v4
        with:
          path: dox-test
      - uses: actions/checkout@v4
        with:
          repository: dartondox/dox
          ref: ${{ inputs.dox_ref || 'develop' }}
          path: dox
      # sqlite3 v3 bundles SQLite with a build hook. No system library needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install and generate models
        working-directory: dox-test
        # the native packages come from pub.dev, with ready-built libraries
        run: |
          cp .env.example .env
          sed -i '/_native:$/,+1d' pubspec_overrides.yaml
          dart pub get
          dart run build_runner build
      - name: Migrate
        working-directory: dox-test
        run: dart run bin/migrate.dart run
      - name: End-to-end checks
        working-directory: dox-test
        run: dart test -r expanded
