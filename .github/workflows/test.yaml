name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dox_ref:
        description: dartondox/dox branch to test against
        default: main

jobs:
  # the React + Vite pages of /inertia build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, sqlite]
    env:
      DB_CONNECTION: ${{ matrix.db }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dox_test
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dox_test
        ports: ["3326:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 2s --health-retries 60
      redis:
        image: redis:8-alpine
        ports: ["6459:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
    steps:
      # MinIO needs a start command, so it can not be a service.
      # The folder made by mkdir is the dox-test bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9110:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            --entrypoint bash cgr.dev/chainguard/minio:latest \
            -c "mkdir -p /data/dox-test && exec minio server /data"
          for i in $(seq 1 30); do docker exec minio mc ready local && break; sleep 2; done
      - uses: actions/checkout@v4
        with:
          path: dox-test
      # dox on the dox_ref input, else on the branch with the same name as
      # this one (a change in dox and dox-test together), else on main
      - name: Pick the dox branch
        id: dox
        env:
          DOX_REF: ${{ inputs.dox_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=${DOX_REF:-}
          if [ -z "$ref" ]; then
            ref=main
            if git ls-remote --exit-code --heads https://github.com/dartondox/dox.git "$BRANCH" >/dev/null; then
              ref=$BRANCH
            fi
          fi
          echo "dox: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dartondox/dox
          ref: ${{ steps.dox.outputs.ref }}
          path: dox
      # dox_orm, dox_query_builder, dox_migration, dox_socketio, dox_storage,
      # dox_queue and dox_scheduler live in their own repos. Clone them next
      # to dox-test (main, or the branch with the same name as this one), so
      # the pubspec_overrides.yaml lines for them work.
      - name: Clone dox-orm, dox-socketio, dox-storage, dox-queue and dox-scheduler
        run: bash dox/ci/clone-siblings.sh
      # sqlite3 v3 bundles SQLite with a build hook. No system library needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install and generate models
        working-directory: dox-test
        # the native packages come from pub.dev, with ready-built libraries.
        # dox_inertia and dox_view come from pub.dev too.
        # the other dox packages come from the local clones. dox_queue and
        # dox_scheduler too: dox_queue on pub.dev needs ioredis 2, and
        # dox_cache of dox main needs ioredis 3.
        run: |
          cp .env.example .env
          sed -i -E '/^  (dox_[a-z]+_native|dox_inertia|dox_view):$/,+1d' pubspec_overrides.yaml
          dart pub get
          dart run build_runner build
      - name: Migrate
        working-directory: dox-test
        run: dart run bin/migrate.dart run
      - name: End-to-end checks
        working-directory: dox-test
        run: dart test -r expanded
