name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dox_ref:
        description: dartondox/dox branch to test against
        default: main

jobs:
  # the React + Vite pages of /inertia build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, sqlite]
        sdk: [stable]
        # Dox supports Dart 3.13 and newer: one extra job checks the
        # lowest SDK, on SQLite only.
        include:
          - db: sqlite
            sdk: '3.13.0'
    env:
      DB_CONNECTION: ${{ matrix.db }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dox_test
        ports: ["5452:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dox_test
        ports: ["3326:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 2s --health-retries 60
      redis:
        image: redis:8-alpine
        ports: ["6459:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
      # catches the emails of the mail tests: SMTP on 1125, HTTP API on 8125
      mailhog:
        image: mailhog/mailhog
        ports: ["1125:1025", "8125:8025"]
    steps:
      # MinIO needs a start command, so it can not be a service.
      # The folder made by mkdir is the dox-test bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9110:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            --entrypoint bash cgr.dev/chainguard/minio:latest \
            -c "mkdir -p /data/dox-test && exec minio server /data"
          for i in $(seq 1 30); do docker exec minio mc ready local && break; sleep 2; done
      - uses: actions/checkout@v4
        with:
          path: dox-test
      # dox on the dox_ref input, else on the branch with the same name as
      # this one (a change in dox and dox-test together), else on main
      - name: Pick the dox branch
        id: dox
        env:
          DOX_REF: ${{ inputs.dox_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=${DOX_REF:-}
          if [ -z "$ref" ]; then
            ref=main
            # refs/heads/ makes it an exact match (feat/main does not match main)
            if git ls-remote --exit-code https://github.com/dartondox/dox.git "refs/heads/$BRANCH" >/dev/null; then
              ref=$BRANCH
            fi
          fi
          echo "dox: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dartondox/dox
          ref: ${{ steps.dox.outputs.ref }}
          path: dox
      # The other Dox packages live in their own repos. Clone them next to
      # dox-test (main, or the branch with the same name as this one), so
      # the pubspec_overrides.yaml lines for them work.
      - name: Clone the other Dox repos
        run: bash dox/ci/clone-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dox-http-native/native -> target
            dox-postgres-native/native -> target
            dox-mysql-native/native -> target
      # Builds the native libraries of the clones, for this machine only
      # (linux x64), into native/target/release. Their build hooks take the
      # library from there.
      - name: Build the native libraries
        run: |
          for repo in dox-http-native dox-postgres-native dox-mysql-native; do
            start=$SECONDS
            cargo build --release --manifest-path "$repo/native/Cargo.toml"
            echo "$repo: built in $((SECONDS - start))s"
          done
      # sqlite3 v3 bundles SQLite with a build hook. No system library needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install and generate models
        working-directory: dox-test
        # all Dox packages come from the local clones, none from pub.dev
        run: |
          cp .env.example .env
          dart pub get
          dart run build_runner build
      # The dox CLI tests run `dart run ../dox-cli/bin/dox.dart`. The CLI
      # must use the same local clones (dox_migration and its packages),
      # not pub.dev. Our overrides have `../<repo>` paths, and dox-cli is
      # next to dox-test, so the same file works there.
      - name: Set up the dox CLI
        working-directory: dox-test
        run: |
          cp pubspec_overrides.yaml ../dox-cli/pubspec_overrides.yaml
          (cd ../dox-cli && dart pub get)
      - name: Migrate
        working-directory: dox-test
        run: dart run bin/migrate.dart run
      - name: End-to-end checks
        working-directory: dox-test
        run: dart test -r expanded
